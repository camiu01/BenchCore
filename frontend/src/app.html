<!-- @file app.html @brief Document template with nonce-authorized pre-paint theme selection. -->
<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f5f2ea" />
		<script nonce="%sveltekit.nonce%">
			try {
				const stored = localStorage.getItem('site-theme');
				document.documentElement.setAttribute(
					'data-theme',
					['light', 'dark', 'oled'].includes(stored) ? stored : 'light'
				);
			} catch {
				document.documentElement.setAttribute('data-theme', 'light');
			}
			const theme = document.documentElement.getAttribute('data-theme');
			document
				.querySelector('meta[name="theme-color"]')
				.setAttribute(
					'content',
					theme === 'dark' ? '#15181c' : theme === 'oled' ? '#000000' : '#f5f2ea'
				);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="kit-body">%sveltekit.body%</div>
	</body>
</html>
