# Full stack: PostgreSQL + API + frontend. Run `docker compose up --build`.
# Copy .env.example to .env to override the defaults below.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blog}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-blog}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD:-blog}@db:5432/${POSTGRES_DB:-blog}
      PORT: 5181
      MEDIA_DIR: /data/media
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:5180}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:5180}
      NODE_ENV: production
    volumes:
      - mediadata:/data/media
    ports:
      - '5181:5181'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 5180
      PUBLIC_API_URL: http://api:5181
      BODY_SIZE_LIMIT: 8M
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:5180}
      NODE_ENV: production
    ports:
      - '5180:5180'

volumes:
  pgdata:
  mediadata:
